name: Unit tests

on: [push]
libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-minor-version: [10, 11, 12, 13, 14, 15-dev]
    name: Python 3.${{ matrix.python-minor-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup pip cache
        uses: actions/cache@v6
        id: pipcache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-
      - name: Set up Python
        uses: actions/setup-python@v7
        id: setuppy
        with:
          python-version: 3.${{ matrix.python-minor-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
      - name: Update Python packages
        run: pip install --upgrade setuptools pip wheel tox
      - name: Install Python dependencies
        run: pip install -r scripts/KlipperScreen-requirements.txt --prefer-binary
      - name: Run tests
        env:
          TOX_ENV: py3${{ matrix.python-minor-version }}
        run: |
          python_env=$(echo $TOX_ENV | sed -e s/-dev$//)
          python -m tox -e ${python_env}
