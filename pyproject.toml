[project]
name = "KlipperScreen"
description = "GUI for Klipper"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version"]

[tool.ruff]
line-length = 100
target-version = "py38"

# Translation helper
builtins = ["_", "ngettext"]

extend-exclude = [
    "docs",
    "scripts",
    ".venv",
]

[tool.setuptools.packages]
find = {}  # Scan the project directory with the default parameters

[tool.ruff.lint]
# E: pycodestyle, /F: Pyflakes, I: isort (import sorting)
select = ["E", "F", "I"]
ignore = [
    "E402", # Module level import not at top of file (needed for gi)
]

[tool.ruff.lint.isort]
known-first-party = ["ks_includes", "panels"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# Test tiers:
#   fidelity -- in-process, no compositor. Proves the fakes reflect reality.
#   render   -- real GTK under headless Weston (Wayland only, no X11).
#   indepth  -- opt-in deeper combinations (languages, multiple selectors).
markers = [
    "fidelity: in-process tests, no display server or compositor required",
    "render: requires headless Weston (Wayland); real GTK allocation",
    "indepth: opt-in deeper combinations (languages, selector sweeps)",
]
filterwarnings = [
    # gi's GLib main-context pump (render tier) calls the deprecated
    # asyncio.get_event_loop_policy() on Python 3.14; unfixable from our side.
    "ignore:.*get_event_loop_policy.*:DeprecationWarning",
]
testpaths = ["tests"]
