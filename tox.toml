requires = ["tox>=4.19"]
env_list = [
    "py310",
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
]
skip_missing_interpreters = true

[env_run_base]
package = "editable"
set_env = { PYTHONDEVMODE = "1" }
deps = ["-rscripts/KlipperScreen-requirements.txt", "-rscripts/dev-requirements.txt"]
commands = [
    ["python", "-m", "pytest"],
]
